<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뽈짬티의 모험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone-height column. Status on top, the cat as a big tappable cushion, action tray at the bottom. */
:root {
  --bg: #e9eef4;          /* cool blue-grey, like a sofa throw */
  --surface: #ffffff;
  --ink: #2a3140;
  --muted: #6b7486;
  --cheese: #f39a2e;      /* cheese-cat orange, the one accent */
  --cheese-soft: #fde3c2;
  --heart: #ef5b78;
  --line: #d3dbe6;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b2029; --surface: #262d39; --ink: #eef1f6; --muted: #9aa3b4;
  --cheese: #f6a845; --cheese-soft: #4a3720; --heart: #ff7891; --line: #374152; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b2029; --surface: #262d39; --ink: #eef1f6; --muted: #9aa3b4;
  --cheese: #f6a845; --cheese-soft: #4a3720; --heart: #ff7891; --line: #374152; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden; }
.app { height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }

header { display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; letter-spacing: -0.5px; }
.tools { display: flex; gap: 6px; }
.icon-btn { font-family: var(--font-display); font-size: 14px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.icon-btn:focus-visible, .act:focus-visible, .cat:focus-visible { outline: 3px solid var(--cheese); outline-offset: 2px; }

.stage-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.stage-name { font-family: var(--font-display); font-size: 18px; }
.stage-name small { font-family: var(--font-body); color: var(--muted); font-size: 13px; margin-left: 4px; }
.pts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--cheese); border-radius: 999px; transition: width .25s ease; }
.pips { display: flex; gap: 4px; }
.pips span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.pips span.on { background: var(--heart); }

.stagearea { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.cat { position: relative; width: min(100%, 52vh); aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; cursor: pointer;
  border-radius: 46% 46% 40% 40% / 48% 48% 38% 38%; overflow: hidden; background: var(--cheese-soft);
  box-shadow: 0 14px 0 -4px color-mix(in srgb, var(--cheese) 35%, transparent); touch-action: manipulation; }
.cat img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.cat.squish { animation: squish .22s ease; }
@keyframes squish { 0%{transform:scale(1)} 40%{transform:scale(1.06,.92)} 100%{transform:scale(1)} }
.cat.shake { animation: shake .4s ease; }
@keyframes shake { 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

.bubble { position: absolute; top: 2%; right: 2%; background: var(--surface); color: var(--ink); border: 2px solid var(--ink);
  border-radius: 18px; padding: 6px 12px; font-family: var(--font-display); font-size: 16px; z-index: 3; max-width: 60%;
  box-shadow: 3px 3px 0 var(--ink); }
.bubble::after { content: ""; position: absolute; left: 18px; bottom: -10px; width: 14px; height: 14px; background: var(--surface);
  border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); }
.caption { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-size: 17px;
  color: var(--ink); z-index: 3; text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.fx b { position: absolute; font-family: var(--font-display); font-weight: 400; color: var(--heart); font-size: 22px; animation: float 0.9s ease-out forwards; }
.fx b.plus { color: var(--cheese); font-size: 18px; }
@keyframes float { from { transform: translateY(0) scale(.8); opacity: 1 } to { transform: translateY(-90px) scale(1.2); opacity: 0 } }

.tray { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 8px 4px;
  font-family: var(--font-display); font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.act .ic { font-size: 22px; line-height: 1; }
.act small { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.act.sel { border-color: var(--cheese); background: var(--cheese-soft); }
.act:disabled { opacity: .45; cursor: default; }
.hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }

.sheet { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent);
  display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 20px; width: min(100%, 400px); max-height: 85%; overflow: auto;
  display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; }
.card p { margin: 0; line-height: 1.6; }
.card img.big { width: 100%; border-radius: 16px; }
.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.album figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.album .ph { width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 24px; color: var(--muted); }
.album .ph img { width: 100%; height: 100%; object-fit: cover; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; font-family: var(--font-display); font-size: 16px; border: 0; border-radius: 14px; padding: 12px; cursor: pointer; background: var(--cheese); color: #2a1a05; }
.btn.ghost { background: var(--bg); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .cat.squish, .cat.shake, .fx b { animation: none; } .fx b { opacity: 0; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>뽈짬티의 모험</h1>
      <div class="tools">
        <button class="icon-btn" id="btnAlbum" type="button">앨범</button>
        <button class="icon-btn" id="btnSound" type="button">소리 끔</button>
      </div>
    </div>
    <div class="stage-row">
      <div class="stage-name" id="stageName">낯선 사람 <small>1단계</small></div>
      <div class="pts" id="pts">0 / 100</div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="pips" id="pips"><span></span><span></span><span></span><span></span><span></span></div>
  </header>

  <div class="stagearea">
    <button class="cat" id="cat" type="button" aria-label="뽈짬티 쓰다듬기">
      <img id="catImg" alt="뽈짬티">
    </button>
    <div class="bubble" id="bubble">츄르...?</div>
    <div class="caption" id="caption">톡 눌러서 말을 걸어보세요</div>
    <div class="fx" id="fx"></div>
  </div>

  <p class="hint" id="hint">행동을 고르고 뽈짬티를 톡톡 누르세요</p>
  <div class="tray" id="tray"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" id="sheetCard"></div>
</div>

let S = { pts: 0, seen: ["idle"], sound: false, ended: false };
try { const s = JSON.parse(localStorage.getItem("ppol-jjamti-v1")); if (s) S = Object.assign(S, s); } catch (e) {}
function save() { try { localStorage.setItem("ppol-jjamti-v1", JSON.stringify(S)); } catch (e) {} }

let selected = "snack", want = "snack", streak = 0, lastAct = null, away = false, reactTimer = null;
const $ = (id) => document.getElementById(id);

function stageIdx(p = S.pts) { let i = 0; STAGES.forEach((s, k) => { if (p >= s.need) i = k; }); return i; }

function renderTray() {
  const st = stageIdx();
  $("tray").innerHTML = "";
  ACTIONS.forEach((a) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "act" + (a.id === selected ? " sel" : ""); b.id = "act-" + a.id;
    const locked = st < a.stage;
    b.disabled = locked;
    b.innerHTML = `<span class="ic">${locked ? "🔒" : a.ic}</span>${a.label}<small>${locked ? (a.stage + 1) + "단계에 열림" : (a.id === "nap" ? "엔딩" : "+" + a.pts)}</small>`;
    b.onclick = () => { selected = a.id; renderTray(); if (a.id === "nap") doNap(); };
    $("tray").appendChild(b);
  });
}

function renderStatus() {
  const i = stageIdx(), s = STAGES[i], next = STAGES[i + 1];
  $("stageName").innerHTML = `${s.name} <small>${i + 1}단계</small>`;
  if (next) {
    $("pts").textContent = `${S.pts} / ${next.need}`;
    $("barFill").style.width = ((S.pts - s.need) / (next.need - s.need) * 100) + "%";
  } else { $("pts").textContent = `${S.pts} · 최고 단계`; $("barFill").style.width = "100%"; }
  [...$("pips").children].forEach((p, k) => p.classList.toggle("on", k <= i));
}

function setFace(key, caption) {
  $("catImg").src = IMG[key];
  if (!S.seen.includes(key)) { S.seen.push(key); save(); }
  if (caption) $("caption").textContent = caption;
}
function restFace() { if (away) return; const s = STAGES[stageIdx()]; setFace(s.idle, s.caption); }

function pickWant() {
  const st = stageIdx();
  const pool = ACTIONS.filter((a) => a.stage <= st && a.id !== "nap" && a.id !== want);
  const arr = pool.length ? pool : ACTIONS.filter((a) => a.stage <= st && a.id !== "nap");
  want = arr[Math.floor(Math.random() * arr.length)].id;
  $("bubble").textContent = ACTIONS.find((a) => a.id === want).want;
  $("bubble").hidden = false;
}

function pop(text, cls, x, y) {
  const b = document.createElement("b"); b.textContent = text; if (cls) b.className = cls;
  b.style.left = x + "px"; b.style.top = y + "px"; $("fx").appendChild(b); setTimeout(() => b.remove(), 950);
}

/* ---- sound: tiny synthesized blips, only after the player turns it on ---- */
let ac = null;
function tone(f1, f2, dur, type = "sine", vol = 0.15) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  tap: () => tone(700, 900, 0.08, "triangle", 0.08),
  meow: () => { tone(520, 820, 0.18, "sawtooth", 0.05); setTimeout(() => tone(820, 480, 0.25, "sawtooth", 0.05), 170); },
  nope: () => tone(300, 160, 0.3, "square", 0.05),
  up: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.15, "triangle", 0.1), i * 110)),
};

function onTap(ev) {
  if (S.ended) { doNap(); return; }
  const r = $("cat").getBoundingClientRect(), host = $("fx").getBoundingClientRect();
  const x = (ev.clientX || r.left + r.width / 2) - host.left - 10, y = (ev.clientY || r.top + r.height / 2) - host.top - 20;
  if (away) { $("caption").textContent = "뽈짬티가 산책 나갔어요. 잠깐 기다려요"; return; }
  const a = ACTIONS.find((q) => q.id === selected);
  if (a.id === "nap") { doNap(); return; }

  streak = (lastAct === a.id) ? streak + 1 : 1; lastAct = a.id;
  const cat = $("cat"); cat.classList.remove("squish", "shake"); void cat.offsetWidth;

  if (streak > BORED_AFTER) { // too much of the same thing
    away = true; streak = 0; sfx.nope();
    setFace("bye", "같은 것만 하니까 질렸대요... 산책 갔다 올게요");
    $("bubble").hidden = true;
    setTimeout(() => { away = false; restFace(); pickWant(); }, AWAY_MS);
    return;
  }

  const before = stageIdx();
  let gain, face, cap;
  if (a.id === want) {
    gain = a.pts * 3; face = Math.random() < 0.5 ? "happy" : "hello"; cap = "바로 그거예요! 기분 최고";
    sfx.meow(); pop("♥", "", x, y); pop("+" + gain, "plus", x + 26, y + 10);
    if (Math.random() < 0.35) pickWant();
  } else if (Math.random() < 0.12) {
    gain = 1; face = "nope"; cap = "음... 지금은 별로래요";
    sfx.nope(); cat.classList.add("shake"); pop("+1", "plus", x, y);
  } else {
    gain = a.pts; face = null; sfx.tap(); cat.classList.add("squish"); pop("+" + gain, "plus", x, y);
  }
  S.pts += gain; save();
  if (face) { setFace(face, cap); clearTimeout(reactTimer); reactTimer = setTimeout(restFace, 900); }

  const after = stageIdx();
  if (after > before) levelUp(after);
  renderStatus();
}

function levelUp(i) {
  sfx.up(); renderTray(); setFace("hello");
  const s = STAGES[i], unlocked = ACTIONS.filter((a) => a.stage === i).map((a) => a.label).join(", ");
  openSheet(`<img class="big" src="${IMG.hello}" alt="">
    <h2>${i + 1}단계 · ${s.name}</h2>
    <p>${s.caption}.${unlocked ? `<br>새 행동 <b>${unlocked}</b>이(가) 열렸어요.` : ""}</p>
    <div class="row"><button class="btn" type="button" data-close>계속하기</button></div>`);
  clearTimeout(reactTimer); reactTimer = setTimeout(restFace, 900); pickWant();
}

function doNap() {
  if (stageIdx() < 4) return;
  S.ended = true; save(); sfx.meow(); setFace("sleepy", "무릎 위에서 새근새근");
  openSheet(`<img class="big" src="${IMG.sleepy}" alt="">
    <h2>뽈짬티가 무릎에서 잠들었어요</h2>
    <p>경계하던 뽈짬티가 이제 당신 무릎을 제일 좋아해요. 첫 번째 뽈짬티와 최애가 되었어요.</p>
    <div class="row"><button class="btn ghost" type="button" data-close>계속 보기</button><button class="btn" type="button" id="btnRestart">처음부터</button></div>`);
  $("btnRestart").onclick = reset;
}

function reset() {
  S = { pts: 0, seen: S.seen, sound: S.sound, ended: false }; save();
  selected = "snack"; streak = 0; lastAct = null; closeSheet(); renderTray(); renderStatus(); restFace(); pickWant();
}

function openSheet(html) {
  $("sheetCard").innerHTML = html; $("sheet").hidden = false;
  $("sheetCard").querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeSheet));
}
function closeSheet() { $("sheet").hidden = true; }
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });

$("btnAlbum").onclick = () => {
  const cells = REACTIONS.map((r) => S.seen.includes(r.key)
    ? `<figure><div class="ph"><img src="${IMG[r.key]}" alt=""></div>${r.name}</figure>`
    : `<figure><div class="ph">?</div>???</figure>`).join("");
  openSheet(`<h2>뽈짬티 앨범</h2><p>본 표정 ${S.seen.length} / ${REACTIONS.length}</p><div class="album">${cells}</div>
    <div class="row"><button class="btn ghost" type="button" id="btnReset">기록 지우기</button><button class="btn" type="button" data-close>닫기</button></div>`);
  $("btnReset").onclick = () => { S.seen = ["idle"]; reset(); };
};
function renderSound() { $("btnSound").textContent = S.sound ? "소리 켬" : "소리 끔"; }
$("btnSound").onclick = () => { S.sound = !S.sound; save(); renderSound(); sfx.tap(); };

$("cat").addEventListener("click", onTap);

renderTray(); renderStatus(); renderSound(); restFace(); pickWant();
if (S.ended) setFace("sleepy", "무릎 위에서 새근새근");
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오니상의 미니게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root { --bg:#eef1f5; --card:#fff; --ink:#2a3140; --muted:#6b7486; --accent:#f39a2e; --line:#d3dbe6; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b2029; --card:#262d39; --ink:#eef1f6; --muted:#9aa3b4; --accent:#f6a845; --line:#374152; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
main { max-width:560px; margin:0 auto; padding-block:40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:16px; }
h1 { font-family:"Jua",sans-serif; font-weight:400; font-size:30px; margin:0; }
p.sub { margin:0; color:var(--muted); }
a.game { display:flex; flex-direction:column; gap:4px; text-decoration:none; color:inherit; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px 20px; }
a.game:hover, a.game:focus-visible { border-color:var(--accent); outline:none; }
a.game strong { font-family:"Jua",sans-serif; font-weight:400; font-size:21px; }
a.game span { color:var(--muted); font-size:14px; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>미니게임 모음</h1>
  <p class="sub">웹에서 바로 하는 작은 게임들이에요.</p>
  <a class="game" href="./ppol-jjamti/"><strong>뽈짬티의 모험</strong><span>뚱뚱하고 귀여운 고양이를 톡톡 눌러 친해지는 클리커 게임 (폰 추천)</span></a>
  <a class="game" href="./bandi-cave/"><strong>반디의 동굴</strong><span>반딧불이를 날갯짓시켜 동굴 바위 틈을 통과하는 원버튼 게임</span></a>
</main>
</body>
</html>
